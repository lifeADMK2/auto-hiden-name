<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life tool (hiden user)</title>

  <style>
    body {
      margin: 0;
      background: #101217;
      color: #f4f5f7;
      font: 16px system-ui;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 20px;
    }

    p { color: #bac2d0; }

    button, input, select {
      background: #252a35;
      color: white;
      border: 1px solid #444b5b;
      border-radius: 8px;
      padding: 9px;
    }

    button { cursor: pointer; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .card {
      background: #191d26;
      border: 1px solid #303542;
      border-radius: 12px;
      padding: 10px;
      min-width: 0;
    }

    .card canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #08090c;
      border-radius: 6px;
    }

    .name { overflow-wrap: anywhere; font-size: 14px; margin: 7px 0; }
    .small { font-size: 13px; color: #b6c0d0; }

    .ver {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border: 1px solid #444b5b;
      border-radius: 6px;
      color: #9fb7ff;
      font-size: 12px;
      font-weight: 600;
      vertical-align: middle;
    }

    /* ── layout ── */
    .bar {
      position: relative;
      display: block;
      min-height: 560px;
    }

    .ctrl-label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: #b6c0d0;
      white-space: nowrap;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-row input[type="text"] {
      width: 42px;
      padding: 6px 8px;
      text-align: center;
    }

    .range-row input[type="range"] { width: 160px; }

    /* ── positions ── */

    #files       { position: absolute; left: 0;    top: 0; }
    #autoAll     { position: absolute; left: 300px; top: 0; white-space: nowrap; width: max-content; }

    #labelEffect      { position: absolute; left: 0;    top: 50px; }
    #labelStrength    { position: absolute; left: 0;    top: 110px; }
    #labelBlurY1      { position: absolute; left: 0;    top: 180px; }
    #labelBlurY2      { position: absolute; left: 0;    top: 250px; }
    #labelCoverText   { position: absolute; left: 0;    top: 320px; }
    #labelWatermark   { position: absolute; left: 0;    top: 380px; }
    #labelWatermarkSize { position: absolute; left: 0;  top: 440px; }

    #labelConcurrency { position: absolute; left: 320px; top: 50px; }

    #zipAll   { position: absolute; left: 0;    top: 510px; white-space: nowrap; width: max-content; }
    #clearAll { position: absolute; left: 150px; top: 510px; white-space: nowrap; width: max-content; }

    #statusRow {
      position: absolute;
      left: 320px;
      top: 110px;
    }

    #status { color: #9fb7ff; min-height: 24px; margin-bottom: 10px; }
    #helpText { font-size: 13px; color: #b6c0d0; max-width: 420px; }

    #gallery {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      left: 0;
      top: 580px;
      width: 100%;
    }

    .bar-spacer { display: block; height: 580px; }
  </style>
</head>

<body>
  <main>
    <h1>Life tool (hiden user) <span class="ver">VER 1.77</span></h1>

    <div class="bar">

      <input id="files" type="file" accept="image/*" multiple>
      <button id="autoAll" disabled>Tự tìm và che tất cả</button>

      <!-- Hiệu ứng -->
      <label id="labelEffect">
        <span class="ctrl-label">Hiệu ứng</span>
        <select id="effect">
          <option value="blur">Làm mờ</option>
          <option value="black">Che đen</option>
          <option value="pixel">Pixel hóa</option>
          <option value="text">Chữ</option>
        </select>
      </label>

      <!-- Mức độ: min 20, max 100 -->
      <label id="labelStrength">
        <span class="ctrl-label">Mức độ</span>
        <div class="range-row">
          <input id="textStrengthInput" type="text" value="30" placeholder="20–100">
          <input id="strength" type="range" min="20" max="100" value="30">
        </div>
      </label>

      <!-- Làm mờ Y1 (trên): min 0, max 50 -->
      <label id="labelBlurY1">
        <span class="ctrl-label">Làm mờ Y1 — mở rộng lên trên (px)</span>
        <div class="range-row">
          <input id="textBlurY1Input" type="text" value="20" placeholder="0–50">
          <input id="blurY1" type="range" min="0" max="50" value="20">
        </div>
      </label>

      <!-- Làm mờ Y2 (dưới): min 0, max 50 -->
      <label id="labelBlurY2">
        <span class="ctrl-label">Làm mờ Y2 — mở rộng xuống dưới (px)</span>
        <div class="range-row">
          <input id="textBlurY2Input" type="text" value="20" placeholder="0–50">
          <input id="blurY2" type="range" min="0" max="50" value="20">
        </div>
      </label>

      <!-- Chữ che vùng -->
      <label id="labelCoverText">
        <span class="ctrl-label">Chữ che vùng</span>
        <input id="coverText" type="text" placeholder="Cần bật hiệu ứng chữ" style="min-width:160px">
      </label>

      <!-- Watermark -->
      <label id="labelWatermark">
        <span class="ctrl-label">Watermark</span>
        <input id="watermarkText" type="text" placeholder="Nhập chữ watermark" style="min-width:160px">
      </label>

      <!-- Cỡ watermark -->
      <label id="labelWatermarkSize">
        <span class="ctrl-label">Cỡ watermark</span>
        <div class="range-row">
          <input id="textWatermarkSizeInput" type="text" value="38" placeholder="10–80">
          <input id="watermarkSize" type="range" min="10" max="80" value="38">
        </div>
      </label>

      <!-- Concurrency -->
      <label id="labelConcurrency">
        <span class="ctrl-label">Xử lý bao nhiêu ảnh / lần</span>
        <select id="concurrency">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="all">Tất cả</option>
        </select>
      </label>

      <button id="zipAll"   disabled>Tải tất cả ZIP</button>
      <button id="clearAll" disabled>Xóa danh sách</button>

      <div id="statusRow">
        <div id="status">Chưa chọn ảnh.</div>
        <p id="helpText" class="small">
          Ảnh phải có icon trade (trade_icon.png) mới tự tìm được.<br>
          Ảnh được xử lý ngay trong trình duyệt, không gửi lên mạng.
        </p>
      </div>

      <div id="gallery"></div>
    </div>
    <span class="bar-spacer"></span>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
