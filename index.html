<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life tool (hiden user)</title>

  <style>
    body {
      margin: 0;
      background: #101217;
      color: #f4f5f7;
      font: 16px system-ui;
    }

    main {
      max-width: 1150px;
      margin: auto;
      padding: 20px;
    }

    p {
      color: #bac2d0;
    }

    .bar {
      position: absolute;
      display: block;
      margin: 12px 0;
      min-height: 700px;
    }

    .actions {
      position: absolute;
      display: block;
      margin: 12px 0;
    }

    button,
    input,
    select {
      background: #252a35;
      color: white;
      border: 1px solid #444b5b;
      border-radius: 8px;
      padding: 9px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .card {
      background: #191d26;
      border: 1px solid #303542;
      border-radius: 12px;
      padding: 10px;
      min-width: 0;
    }

    .card canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #08090c;
      border-radius: 6px;
    }

    .name {
      overflow-wrap: anywhere;
      font-size: 14px;
      margin: 7px 0;
    }

    .small {
      font-size: 13px;
      color: #b6c0d0;
    }

    #status {
      color: #9fb7ff;
      min-height: 24px;
    }

    .ver {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border: 1px solid #444b5b;
      border-radius: 6px;
      color: #9fb7ff;
      font-size: 12px;
      font-weight: 600;
      vertical-align: middle;
    }

    /* =========================================
       TỌA ĐỘ X/Y - CHỈNH Ở KHU VỰC NÀY
       =========================================

       label-x / label-y: tọa độ chữ nhãn.
       control-x / control-y: tọa độ input, select.
       button-x / button-y: tọa độ nút.

       X dương = sang phải.
       X âm = sang trái.
       Y dương = xuống dưới.
       Y âm = lên trên.

       Đơn vị: px.
       ========================================= */


/* Khung tọa độ */
.bar {
  position: relative;
  display: block;
  min-height: 700px;
}

/* 1. Chọn ảnh */
#files {
  position: absolute;
  left: 0px;
  top: 0px;
}

/* 2. Nút tự tìm */
#autoAll {
  position: absolute;
  left: 300px;
  top: 0px;
  white-space: nowrap;
  width: max-content;
  max-width: none;
  flex-shrink: 0;
}

/* 3. Nhóm xử lý bao nhiêu ảnh */
#labelConcurrency {
  position: absolute;
  left: 0px;
  top: 10px;
}

#textConcurrency {
  position: absolute;
  left: 0px;
  top: 50px;
  white-space: nowrap;
}

#concurrency {
  position: absolute;
  left: 0px;
  top: 75px;
}

/* 4. Nhóm hiệu ứng */
#labelEffect {
  position: absolute;
  left: 0px;
  top: 10px;
}

#textEffect {
  position: absolute;
  left: 0px;
  top: 125px;
  white-space: nowrap;
}

#effect {
  position: absolute;
  left: 0px;
  top: 155px;
}

/* 5. Nhóm mức độ */
#labelStrength {
  position: absolute;
  left: 110px;
  top: -65px;
}

#textStrength {
  position: absolute;
  left: 0px;
  top: 200px;
  white-space: nowrap;
}

#strength {
  position: absolute;
  left: 0px;
  top: 225px;
}

/* 6. Nhóm chữ che vùng */
#labelCoverText {
  position: absolute;
  left: 0px;
  top: -50px;
}

#textCoverText {
  position: absolute;
  left: 0px;
  top: 275px;
  white-space: nowrap;
}

#coverText {
  position: absolute;
  left: 0px;
  top: 300px;
}

/* 7. Nhóm watermark */
#labelWatermark {
  position: absolute;
  left: 0px;
  top: -50px;
}

#textWatermark {
  position: absolute;
  left: 0px;
  top: 350px;
  white-space: nowrap;
}

#watermarkText {
  position: absolute;
  left: 0px;
  top: 375px;
}

/* 8. Nhóm cỡ watermark */
#labelWatermarkSize {
  position: absolute;
  left: 220px;
  top: -125px;
}

#textWatermarkSize {
  position: absolute;
  left: 0px;
  top: 425px;
  white-space: nowrap;
}

#watermarkSize {
  position: absolute;
  left: 0px;
  top: 450px;
}

/* 9. Nút tải ZIP */
#zipAll {
  position: absolute;
  left: 0px;
  top: 400px;
  white-space: nowrap;
  width: max-content;
}

/* 10. Nút xóa danh sách */
#clearAll {
  position: absolute;
  left: 150px;
  top: 400px;
  white-space: nowrap;
  width: max-content;
}

/* 11. Chữ trạng thái */
#status {
  position: relative;
  left: 10px;
  top: -150px;
}

/* 12. Chữ hướng dẫn */
#helpText {
  position: relative;
  left: 10px;
  top: -150px;
}

  </style>
</head>

<body>
  <main>
    <h1>
      Life tool (hiden user)
      <span class="ver">VER 1.6</span>
    </h1>

    <p>Chọn ảnh, tìm chữ Trading with và làm mờ toàn bộ dải ngang.</p>

    <div class="bar">
      <input id="files" type="file" accept="image/*" multiple>

      <button id="autoAll" disabled>
        Tự tìm và che tất cả
      </button>

      <label id="labelConcurrency">
        <span id="textConcurrency">
          Xử lý bao nhiêu ảnh trong 1 lần (máy yếu vui lòng để xử lý ở mức thấp)
        </span>
        <select id="concurrency">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="all">Tất cả</option>
        </select>
      </label>

      <label id="labelEffect">
        <span id="textEffect">Hiệu ứng</span>
        <select id="effect">
          <option value="blur">Làm mờ</option>
          <option value="black">Che đen</option>
          <option value="pixel">Pixel hóa</option>
          <option value="text">Chữ</option>
        </select>
      </label>

      <label id="labelStrength">
        <span id="textStrength">Mức độ</span>
        <input id="strength" type="range" min="4" max="50" value="18">
      </label>

      <label id="labelCoverText">
        <span id="textCoverText">Chữ che vùng</span>
        <input id="coverText" type="text" placeholder="Cần bật hiệu ứng chữ" style="min-width:160px">
      </label>

      <label id="labelWatermark">
        <span id="textWatermark">Watermark</span>
        <input id="watermarkText" type="text" placeholder="Nhập chữ watermark" style="min-width:160px">
      </label>

      <label id="labelWatermarkSize">
        <span id="textWatermarkSize">Cỡ watermark</span>
        <input id="watermarkSize" type="range" min="10" max="80" value="28">
      </label>

      <button id="zipAll" disabled>Tải tất cả ZIP</button>
      <button id="clearAll" disabled>Xóa danh sách</button>
    </div>

    <div id="status">Chưa chọn ảnh.</div>
    <div id="gallery"></div>

    <p id="helpText" class="small">
      Cần ảnh có chữ "Tradding with" bên trong nếu không sẽ không hoạt động.
      Ảnh được xử lý ngay trong trình duyệt.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
